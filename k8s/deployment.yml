apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-inheritance-vault
  namespace: seclock
  labels:
    app: digital-inheritance-vault
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digital-inheritance-vault
  template:
    metadata:
      labels:
        app: digital-inheritance-vault
    spec:
      containers:
        - name: digital-inheritance-vault
          image: 076510357908.dkr.ecr.ap-south-1.amazonaws.com/digital-inheritance-vault:26
          ports:
            - containerPort: 8080
